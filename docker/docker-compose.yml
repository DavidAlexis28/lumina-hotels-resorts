version: "3.8"

services:
  sqlserver-lumina:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lumina_sqlserver_2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${LUMINA_DB_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    deploy:
      resources:
        limits:
          memory: 2048M
    volumes:
      - lumina_sql_data:/var/opt/mssql
      - ../database:/scripts
    restart: unless-stopped

volumes:
  lumina_sql_data:
